<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Portal — O-Level Countdown</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .portal-container { max-width: 700px; width: 100%; }
    .login-box { text-align: center; }
    .login-box input { width: 100%; max-width: 300px; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 16px; font-family: inherit; background: var(--surface); color: var(--text); margin-bottom: 12px; }
    .login-box input:focus { border-color: var(--primary); outline: none; }
    .login-error { color: var(--danger); font-size: 14px; margin-top: 8px; }
    .feedback-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
    .feedback-card .name { font-weight: 600; font-size: 15px; }
    .feedback-card .email { font-size: 13px; color: var(--text2); }
    .feedback-card .date { font-size: 12px; color: var(--text2); float: right; }
    .feedback-card .message { margin-top: 8px; font-size: 14px; white-space: pre-wrap; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
    .toolbar h2 { flex: 1; }
    .badge { font-size: 12px; padding: 2px 10px; border-radius: 20px; background: var(--surface2); color: var(--text2); }
  </style>
</head>
<body>
  <div class="portal-container">
    <!-- Login -->
    <div id="login-view" class="login-box">
      <h1 style="margin-bottom:8px">Owner Portal</h1>
      <p style="color:var(--text2);margin-bottom:20px">Enter the admin key to access feedback submissions.</p>
      <input type="password" id="admin-key-input" placeholder="Admin key" autocomplete="off">
      <button id="btn-login" class="btn btn-primary" style="display:block;margin:0 auto">Access Portal</button>
      <div id="login-error" class="login-error hidden"></div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-view" class="hidden">
      <div class="toolbar">
        <h2>Feedback Submissions</h2>
        <span id="feedback-count" class="badge">0</span>
        <button id="btn-refresh" class="btn btn-icon" title="Refresh">&#x21bb;</button>
        <button id="btn-clear-all" class="btn btn-danger btn-small">Clear All</button>
        <button id="btn-logout" class="btn btn-small">Logout</button>
      </div>
      <div id="feedback-list"></div>
      <p id="empty-state" class="hidden" style="text-align:center;padding:40px;color:var(--text2)">No feedback submissions yet.</p>
    </div>
  </div>

  <script>
    let adminKey = '';

    document.getElementById('btn-login').addEventListener('click', login);
    document.getElementById('admin-key-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

    async function login() {
      const key = document.getElementById('admin-key-input').value.trim();
      if (!key) return;
      adminKey = key;
      try {
        const res = await fetch('/api/feedback', { headers: { 'X-Admin-Key': key } });
        if (!res.ok) throw new Error('Unauthorized');
        const data = await res.json();
        localStorage.setItem('_owner_key', key);
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('dashboard-view').classList.remove('hidden');
        renderFeedback(data);
      } catch {
        // Fallback: try localStorage (works when opening file locally or server down)
        const local = localStorage.getItem('owner_feedback');
        if (local && key === localStorage.getItem('_owner_key')) {
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('dashboard-view').classList.remove('hidden');
          renderFeedback(JSON.parse(local));
          return;
        }
        document.getElementById('login-error').textContent = 'Invalid admin key or server not reachable.';
        document.getElementById('login-error').classList.remove('hidden');
        adminKey = '';
      }
    }

    function renderFeedback(data) {
      const list = document.getElementById('feedback-list');
      const empty = document.getElementById('empty-state');
      document.getElementById('feedback-count').textContent = data.length;
      if (!data.length) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      list.innerHTML = data.map(f =>
        `<div class="feedback-card">
          <span class="date">${new Date(f.date).toLocaleDateString('en-SG', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })}</span>
          <div class="name">${f.name}</div>
          ${f.email ? `<div class="email">${f.email}</div>` : ''}
          <div class="message">${f.message}</div>
        </div>`
      ).join('');
    }

    document.getElementById('btn-refresh').addEventListener('click', async () => {
      if (!adminKey) return;
      try {
        const res = await fetch('/api/feedback', { headers: { 'X-Admin-Key': adminKey } });
        if (res.ok) renderFeedback(await res.json());
      } catch {
        // fallback to localStorage
        const local = localStorage.getItem('owner_feedback');
        renderFeedback(local ? JSON.parse(local) : []);
      }
    });

    document.getElementById('btn-clear-all').addEventListener('click', async () => {
      if (!adminKey || !confirm('Delete all feedback?')) return;
      try {
        const res = await fetch('/api/feedback', { method: 'DELETE', headers: { 'X-Admin-Key': adminKey } });
        if (res.ok) clearDashboard();
      } catch {
        localStorage.removeItem('owner_feedback');
        clearDashboard();
      }
    });

    function clearDashboard() {
      document.getElementById('feedback-list').innerHTML = '';
      document.getElementById('feedback-count').textContent = '0';
      document.getElementById('empty-state').classList.remove('hidden');
    }

    document.getElementById('btn-logout').addEventListener('click', () => {
      adminKey = '';
      document.getElementById('dashboard-view').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
      document.getElementById('admin-key-input').value = '';
      document.getElementById('login-error').classList.add('hidden');
    });
  </script>
</body>
</html>
